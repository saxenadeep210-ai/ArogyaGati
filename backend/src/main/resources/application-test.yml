server:
  port: 0

spring:
  application:
    name: arogyagati-backend-test
  datasource:
    url: jdbc:h2:mem:arogyagati_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: test_secret_key_minimum_512_bits_long_for_hmac_sha512_testing_purposes_only_2026_arogyagati
  expiration-ms: 3600000
  refresh-expiration-ms: 86400000

gemini:
  api-key: mock-test-key
  model: gemini-1.5-flash
  timeout-ms: 5000

cors:
  allowed-origins: http://localhost:3000
